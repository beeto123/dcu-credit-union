<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="dashboard">

<div class="sidebar">

<div class="logo">
<i class="fa-solid fa-building-columns"></i>
<h2>Unity CU</h2>
</div>

<ul>

<li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

<li class="active"><a href="withdraw.html"><i class="fa-solid fa-money-bill-wave"></i> Withdraw</a></li>

<li><a href="#"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transfer</a></li>

</div>

<div class="main">

<h1>Withdraw Funds</h1>

<div class="withdraw-card">

<h3>Available Balance</h3>

<h2>$15,482.25</h2>

<form id="withdrawForm">

<label>Amount</label>

<input
type="number"
placeholder="Enter amount"
id="amount">

<label>Withdrawal Method</label>

<select id="method">

<option>Bank Transfer</option>

<option>Zelle</option>

<option>Cash Pickup</option>

<option>Wire Transfer</option>

</select>

<label>Description</label>

<textarea
rows="4"
placeholder="Optional"></textarea>

<button type="submit">

Request Withdrawal

</button>

</form>

</div>

<div class="notice">

<h3>Important</h3>

<p>

Every withdrawal request requires administrator approval before funds are released.

</p>

</div>

</div>

</div>

<script src="js/withdraw.js"></script>

</body>
