<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Unity Credit Union</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/customer.css">

    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
            margin-bottom: 25px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0b6b45;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-size: 28px;
            color: #0b6b45;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: #888;
            font-size: 16px;
        }

        .profile-info .badge {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        .detail-card .label {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .detail-card .value {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            word-break: break-all;
        }

        .menu-toggle {
            display: none !important;
            background: #0b6b45;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex !important;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 28px;
            }

            .profile-info h2 {
                font-size: 22px;
            }

            .profile-details {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .detail-card {
                padding: 18px;
            }

            .detail-card .value {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .profile-header {
                padding: 15px;
            }

            .profile-avatar {
                width: 60px;
                height: 60px;
                font-size: 22px;
            }

            .profile-info h2 {
                font-size: 18px;
            }

            .profile-info p {
                font-size: 14px;
            }

            .detail-card {
                padding: 14px;
            }

            .detail-card .value {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="images/logo.png" alt="DCU">
            </div>

            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="customer-withdraw.html"><i class="fa-solid fa-money-bill-wave"></i> Withdraw</a></li>
                <li><a href="customer-transfer.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transfer</a></li>
                <li><a href="#"><i class="fa-solid fa-credit-card"></i> Cards</a></li>
                <li><a href="#"><i class="fa-solid fa-building"></i> Loans</a></li>
                <li><a href="#"><i class="fa-solid fa-chart-line"></i> Investments</a></li>
                <li class="active"><a href="customer-profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>

        </aside>

        <!-- ================= MAIN ================= -->
        <main class="main">

            <header>

                <!-- Hamburger menu button (mobile) -->
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search transactions...">
                </div>

                <div class="header-right">

                    <div class="profile-card">
                        <div class="avatar" id="avatarInitials">AD</div>
                        <div>
                            <h4 id="customerName">Amanda Diaz</h4>
                            <small id="lastLogin">Last login: Just now</small>
                        </div>
                    </div>

                </div>

            </header>

            <div class="profile-container">

                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">AD</div>
                    <div class="profile-info">
                        <h2 id="fullName">Amanda Donna Diaz</h2>
                        <p id="email">Amandadiaz24447@gmail.com</p>
                        <span class="badge"><i class="fa-solid fa-check-circle"></i> Verified Member</span>
                    </div>
                </div>

                <div class="profile-details">
                    <div class="detail-card">
                        <div class="label"><i class="fa-solid fa-hashtag"></i> Account Number</div>
                        <div class="value" id="accountNumber">---</div>
                    </div>
                    <div class="detail-card">
                        <div class="label"><i class="fa-solid fa-building-columns"></i> Routing Number</div>
                        <div class="value" id="routingNumber">---</div>
                    </div>
                    <div class="detail-card">
                        <div class="label"><i class="fa-solid fa-calendar"></i> Member Since</div>
                        <div class="value" id="memberSince">---</div>
                    </div>
                    <div class="detail-card">
                        <div class="label"><i class="fa-solid fa-credit-card"></i> Account Type</div>
                        <div class="value">Checking &amp; Savings</div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script src="js/customer-profile.js"></script>

    <script>
        // ========================================
        // MOBILE SIDEBAR TOGGLE
        // ========================================

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('open');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.querySelector('.sidebar');
            const toggle = document.querySelector('.menu-toggle');
            if (window.innerWidth <= 768) {
                if (sidebar && toggle) {
                    if (!sidebar.contains(event.target) && !toggle.contains(event.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            }
        });

        window.addEventListener('resize', function() {
            const sidebar = document.querySelector('.sidebar');
            if (window.innerWidth > 768) {
                if (sidebar) {
                    sidebar.classList.remove('open');
                }
            }
        });
    </script>

</body>
</html>
